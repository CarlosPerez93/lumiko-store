<article
  class="card-surface group flex h-full cursor-pointer flex-col"
  (click)="open()"
  tabindex="0"
  role="button"
  [attr.aria-label]="'Ver ' + product.name"
  (keydown.enter)="open()"
>
  <!-- Imagen -->
  <div class="relative aspect-square overflow-hidden bg-ink-800">
    <img
      [src]="product.image"
      [alt]="product.name + ' — ' + product.tagline"
      class="h-full w-full object-cover transition-transform duration-[900ms] ease-out group-hover:scale-[1.08]"
      loading="lazy"
    />
    <div class="pointer-events-none absolute inset-0 bg-gradient-to-t from-ink-900/[0.85] via-transparent to-transparent opacity-80"></div>

    <!-- Etiqueta -->
    <div class="absolute left-4 top-4 flex flex-col items-start gap-2">
      <span
        *ngIf="product.badge"
        class="rounded-full border px-2.5 py-1 text-[10px] font-bold uppercase tracking-widest backdrop-blur-md"
        [ngClass]="badgeClasses"
      >
        {{ product.badge }}
      </span>
    </div>

    <!-- Favorito -->
    <button
      type="button"
      (click)="wish($event)"
      class="absolute right-4 top-4 flex h-9 w-9 items-center justify-center rounded-full border border-white/[0.15] bg-ink-900/60 text-white backdrop-blur-md transition-all duration-300 hover:border-neon-pink/60 hover:bg-neon-pink/20"
      [attr.aria-pressed]="wished"
      aria-label="Añadir a favoritos"
    >
      <svg class="h-4 w-4 transition-transform duration-300" [class.scale-110]="wished" [attr.fill]="wished ? 'currentColor' : 'none'" [class.text-neon-pink]="wished" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 20s-7-4.3-7-9.2A4.1 4.1 0 0 1 12 8a4.1 4.1 0 0 1 7 2.8C19 15.7 12 20 12 20Z"/>
      </svg>
    </button>

    <!-- Ver ficha -->
    <div class="absolute inset-x-3 bottom-3 translate-y-4 opacity-0 transition-all duration-500 ease-out group-hover:translate-y-0 group-hover:opacity-100">
      <span class="flex items-center justify-center gap-2 rounded-full border border-white/20 bg-white/10 py-2.5 text-xs font-semibold text-white backdrop-blur-xl">
        <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.6"/></svg>
        Ver ficha completa
      </span>
    </div>
  </div>

  <!-- Info -->
  <div class="flex flex-1 flex-col p-5">
    <div class="flex items-center justify-between gap-3">
      <span class="truncate text-[10px] font-semibold uppercase tracking-[0.18em] text-slate-500">{{ categoryLabels[product.category] }}</span>
      <span class="flex shrink-0 items-center gap-1 text-[11px] font-semibold text-amber-300">
        <svg class="h-3 w-3" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.6l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.5 6.1 20.6l1.2-6.5L2.5 9.5l6.6-.9L12 2.6z"/></svg>
        {{ product.rating }}
        <span class="font-normal text-slate-500">({{ product.sales }} vendidos)</span>
      </span>
    </div>

    <h3 class="mt-2 font-display text-[17px] font-semibold leading-snug text-white transition-colors duration-300 group-hover:text-neon-pink">
      {{ product.name }}
    </h3>
    <p class="mt-1.5 line-clamp-2 text-xs leading-relaxed text-slate-500">{{ product.tagline }}</p>

    <div class="mt-auto flex items-end justify-between gap-3 pt-5">
      <div>
        <div class="flex items-baseline gap-2">
          <span class="font-display text-lg font-bold text-white">{{ product.price | currency: 'EUR' : 'symbol' : '1.2-2' }}</span>
        </div>
        <p class="mt-0.5 text-[10px] uppercase tracking-wider text-slate-600">IVA incluido</p>
      </div>

      <button
        type="button"
        (click)="addToCart($event)"
        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full border border-white/[0.15] bg-white/[0.05] text-white transition-all duration-300 hover:scale-105 hover:border-transparent hover:bg-gradient-to-br hover:from-neon-pink hover:to-neon-violet hover:shadow-glow"
        [attr.aria-label]="'Añadir ' + product.name + ' al carrito'"
      >
        <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </div>
</article>
