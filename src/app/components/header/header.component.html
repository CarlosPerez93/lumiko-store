<div class="fixed inset-x-0 top-0 z-50">
  <!-- Barra de anuncios -->
  <div class="hidden border-b border-white/5 bg-ink-900/90 backdrop-blur-md md:block">
    <div class="container-x flex h-9 items-center justify-between text-[11px] font-medium tracking-wide text-slate-400">
      <p class="flex items-center gap-2">
        <span class="relative flex h-1.5 w-1.5">
          <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-neon-lime opacity-75"></span>
          <span class="relative inline-flex h-1.5 w-1.5 rounded-full bg-neon-lime"></span>
        </span>
        Envío gratis desde 49 € · Proveedores verificados en Alibaba.com
      </p>
      <div class="flex items-center gap-6">
        <a routerLink="/catalogo" class="transition hover:text-white">Catálogo completo</a>
        <a routerLink="/" fragment="faq" class="transition hover:text-white">Soporte</a>
        <span class="flex items-center gap-1.5 text-slate-500">
          ES
          <svg class="h-3 w-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6"/></svg>
          EUR
        </span>
      </div>
    </div>
  </div>

  <!-- Navegación -->
  <header
    class="transition-all duration-500"
    [class.border-b]="scrolled"
    [class.backdrop-blur-xl]="scrolled"
    [class.nav-elevated]="scrolled"
    [ngClass]="scrolled ? 'border-white/10 bg-ink-900/80' : ''"
  >
    <div class="container-x flex h-[68px] items-center justify-between gap-6 transition-all duration-500" [class.nav-compact]="scrolled">
      <!-- Logo -->
      <a routerLink="/" class="group flex items-center gap-3" aria-label="LUMIKO, inicio">
        <span class="relative flex h-10 w-10 items-center justify-center rounded-2xl bg-gradient-to-br from-neon-pink via-fuchsia-500 to-neon-violet shadow-glow transition-transform duration-500 group-hover:rotate-[8deg]">
          <svg class="h-5 w-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5.9 1.2.9 2V16h5.4v-.2c0-.8.3-1.5.9-2A6 6 0 0 0 12 3Z"/>
          </svg>
          <span class="absolute inset-0 rounded-2xl bg-white/20 opacity-0 transition-opacity duration-500 group-hover:opacity-100"></span>
        </span>
        <span class="flex flex-col leading-none">
          <span class="font-display text-[17px] font-extrabold tracking-[0.22em] text-white">LUMIKO</span>
          <span class="mt-1 text-[9px] uppercase tracking-[0.3em] text-slate-500">smart play</span>
        </span>
      </a>

      <!-- Enlaces desktop -->
      <nav class="hidden items-center gap-1 lg:flex" aria-label="Principal">
        <a
          *ngFor="let link of links"
          [routerLink]="link.path"
          [fragment]="link.fragment"
          routerLinkActive="text-white"
          [routerLinkActiveOptions]="{ exact: link.path === '/' && !link.fragment }"
          class="group relative rounded-full px-4 py-2 text-sm font-medium text-slate-300 transition-colors duration-300 hover:text-white"
        >
          {{ link.label }}
          <span class="absolute inset-x-4 -bottom-0.5 h-px scale-x-0 bg-gradient-to-r from-neon-pink to-neon-cyan transition-transform duration-300 group-hover:scale-x-100"></span>
        </a>
        <a routerLink="/catalogo" class="ml-2 flex items-center gap-1.5 rounded-full border border-neon-lime/30 bg-neon-lime/10 px-3 py-1.5 text-xs font-semibold text-neon-lime">
          <span class="h-1.5 w-1.5 rounded-full bg-neon-lime"></span>
          {{ stats.products }} productos reales
        </a>
      </nav>

      <!-- Acciones -->
      <div class="flex items-center gap-2 sm:gap-3">
        <a routerLink="/catalogo" class="hidden items-center gap-2 rounded-full border border-white/10 bg-white/[0.04] px-4 py-2.5 text-sm text-slate-400 transition hover:border-white/25 hover:text-white xl:flex">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path stroke-linecap="round" d="m20 20-3.2-3.2"/></svg>
          Buscar en la tienda
        </a>

        <button type="button" class="icon-btn group" (click)="openCart()" aria-label="Abrir carrito">
          <svg class="h-[18px] w-[18px] transition-transform duration-300 group-hover:-translate-y-0.5" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 7h12l-1 12H7L6 7Z"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 7a3 3 0 0 1 6 0"/>
          </svg>
          <span
            *ngIf="cart.state$ | async as state"
            [class.scale-100]="state.count > 0"
            [class.scale-0]="state.count === 0"
            class="absolute -right-1 -top-1 flex h-5 min-w-[20px] items-center justify-center rounded-full bg-gradient-to-br from-neon-pink to-neon-violet px-1 text-[10px] font-bold text-white shadow-glow transition-transform duration-300"
          >
            {{ state.count }}
          </span>
        </button>

        <button
          type="button"
          class="icon-btn lg:hidden"
          (click)="toggleMenu()"
          [attr.aria-expanded]="menuOpen"
          aria-label="Abrir menú"
        >
          <svg *ngIf="!menuOpen" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" d="M4 7h16M4 12h16M4 17h10"/></svg>
          <svg *ngIf="menuOpen" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
    </div>

    <!-- Menú móvil -->
    <div
      *ngIf="menuOpen"
      class="overflow-hidden border-t border-white/10 bg-ink-800/95 backdrop-blur-xl lg:hidden"
    >
      <nav class="container-x flex flex-col gap-1 py-5">
        <a
          *ngFor="let link of links"
          [routerLink]="link.path"
          [fragment]="link.fragment"
          (click)="closeMenu()"
          class="rounded-xl px-3 py-3 text-base font-medium text-slate-200 transition hover:bg-white/5 hover:text-white"
        >
          {{ link.label }}
        </a>
        <button type="button" (click)="openCart()" class="btn-primary mt-3 w-full">Ver mi carrito</button>
      </nav>
    </div>
  </header>
</div>
